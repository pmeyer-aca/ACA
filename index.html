<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACA U18 — Suivi de saison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
  :root{
    --bg:#F1F3EE;
    --panel:#FFFFFF;
    --ink:#14181A;
    --ink-soft:#4B5450;
    --pitch:#1E5631;
    --pitch-light:#3F8351;
    --brick:#A93F2B;
    --line:#D8D9D2;
    --line-strong:#B9BCB3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num,.tab-btn,.scoreboard .big{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  a{color:var(--pitch);}

  /* ---------- Masthead ---------- */
  header.masthead{
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
  }
  .masthead-inner{
    max-width:980px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .crest{
    width:40px;height:40px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
    flex:none;
    border:2px solid #fff;
  }
  .brand-text h1{
    margin:0;
    font-size:17px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
  }
  .brand-text p{
    margin:1px 0 0;
    font-size:12.5px;
    color:#B9C3BC;
    font-family:'Inter',sans-serif;
  }
  .tabs{display:flex;gap:6px;}
  .tab-btn{
    background:transparent;
    border:1px solid #454E4A;
    color:#D9DDD9;
    padding:8px 16px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:2px;
  }
  .tab-btn.active{
    background:var(--pitch);
    border-color:var(--pitch);
    color:#fff;
  }

  main{max-width:980px;margin:0 auto;padding:24px 20px 60px;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- Scoreboard hero ---------- */
  .scoreboard{
    background:var(--ink);
    color:#fff;
    padding:22px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .scoreboard .record{display:flex;gap:22px;align-items:baseline;}
  .scoreboard .record div{text-align:center;}
  .scoreboard .big{font-size:34px;line-height:1;}
  .scoreboard .record .v .big{color:var(--pitch-light);}
  .scoreboard .record .n .big{color:#D9DDD9;}
  .scoreboard .record .d .big{color:#D98066;}
  .scoreboard .record small{display:block;font-size:11px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .scoreboard .goals{text-align:right;}
  .scoreboard .goals .big{font-size:26px;}
  .scoreboard .goals .big .for{color:var(--pitch-light);}
  .scoreboard .goals .big .sep{color:#6B746F;padding:0 6px;}
  .scoreboard .goals .big .against{color:#D98066;}
  .scoreboard .goals small{display:block;color:#9BA39D;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:center;
    padding:12px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .filters label{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .filters select, .filters input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:6px 10px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    border-radius:2px;
  }
  .filters .radio-group{display:flex;gap:14px;}
  .filters .radio-group label{gap:6px;cursor:pointer;}

  h2.section-title{
    font-size:19px;
    margin:34px 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
  }
  h2.section-title:first-child{margin-top:0;}

  /* ---------- Tables ---------- */
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    background:var(--panel);
  }
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:2px solid var(--ink);
    white-space:nowrap;
  }
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th.sort-active{color:var(--pitch);}
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:nth-child(even){background:#F7F8F5;}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-block;
    padding:2px 8px;
    font-size:12px;
    font-weight:600;
    border-radius:2px;
  }
  .badge.v{background:#E1EEE4;color:var(--pitch);}
  .badge.n{background:#EEEEEA;color:var(--ink-soft);}
  .badge.d{background:#F3E1DC;color:var(--brick);}

  .table-wrap{overflow-x:auto;margin-bottom:8px;}

  /* ---------- Charts ---------- */
  .chart-box{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:28px;
  }
  .chart-box canvas{max-height:320px;}

  /* ---------- Niveau bilan ---------- */
  .niveau-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:28px;
  }
  .niveau-cell{background:var(--panel);padding:14px 16px;}
  .niveau-cell h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);font-family:'Inter',sans-serif;font-weight:600;}
  .niveau-cell .stat{font-family:'Oswald',sans-serif;font-size:22px;}
  .niveau-cell .stat small{font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-soft);}

  /* ---------- Player card ---------- */
  .player-picker{margin-bottom:16px;}
  .player-card{
    background:var(--ink);
    color:#fff;
    padding:22px 24px;
    margin-bottom:28px;
  }
  .player-card h3{margin:0 0 4px;font-size:22px;color:#fff;}
  .player-card .team-tag{font-size:12.5px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;}
  .player-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:16px;
  }
  .player-stats div{text-align:left;}
  .player-stats .num{font-size:26px;color:var(--pitch-light);}
  .player-stats small{display:block;font-size:11px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

  .empty, .error{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .error{color:var(--brick);}

  footer{
    max-width:980px;margin:0 auto;padding:10px 20px 40px;
    font-size:12px;color:var(--ink-soft);
  }

  @media (max-width:640px){
    .scoreboard{flex-direction:column;align-items:flex-start;}
    .scoreboard .goals{text-align:left;}
    h1{font-size:15px;}
    #match-table th:nth-child(3), #match-table td:nth-child(3),
    #match-table th:nth-child(7), #match-table td:nth-child(7){display:none;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="crest">ACA</div>
      <div class="brand-text">
        <h1>Alliance Centre Alsace</h1>
        <p>U18 Équipe 2 — Suivi de saison</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="equipe">Équipe</button>
      <button class="tab-btn" data-view="joueurs">Joueurs</button>
    </div>
  </div>
</header>

<main id="app">
  <div id="loading" class="empty">Chargement des statistiques…</div>
</main>

<footer id="footer" style="display:none;">
  Données lues depuis <code>data.xlsx</code>. Pour mettre à jour ces chiffres, remplacez ce fichier par votre classeur Excel exporté (même nom).
</footer>

<script>
const DATA_FILE = 'data.xlsx';

const state = {
  matches: [],
  players: [],
  currentView: 'equipe',
  filters: { competition: 'Toutes', lieu: 'Tous' },
  playerFilters: { scope: 'eq2', search: '' },
  sort: { col: 'buts', dir: 'desc' },
  selectedPlayer: null,
};

let gapChart = null, topScorersChart = null;

// ---------------------------------------------------------------
// Chargement et lecture du classeur
// ---------------------------------------------------------------
async function init() {
  try {
    const res = await fetch(DATA_FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error('fichier introuvable (' + res.status + ')');
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });

    state.matches = parseMatches(wb);
    state.players = parsePlayers(wb);

    document.getElementById('footer').style.display = 'block';
    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="error">Impossible de charger les statistiques.<br>' +
      'Vérifiez que le fichier <code>' + DATA_FILE + '</code> est bien présent à côté de cette page.<br>' +
      '<small>Détail technique : ' + escapeHtml(err.message) + '</small></div>';
  }
}

function sheetRows(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
}

function parseMatches(wb) {
  const raw = sheetRows(wb, 'Matchs');
  const out = [];
  for (let i = 3; i < raw.length; i++) {
    const r = raw[i];
    if (!r || r[1] == null) continue; // pas de date = match non encore joué
    out.push({
      numero: r[0], date: r[1], adversaire: r[2], competition: r[3] || '—',
      lieu: r[4] || '—', duree: r[5], scoreNous: r[6], scoreAdv: r[7],
      convoques: r[8], renforts: r[9], niveau: r[11] || 'Inconnu',
    });
  }
  out.sort((a, b) => new Date(a.date) - new Date(b.date));
  return out;
}

function parsePlayers(wb) {
  const raw = sheetRows(wb, 'Cumul Saison');
  const out = [];
  for (let i = 4; i < raw.length; i++) {
    const r = raw[i];
    if (!r || r[0] == null) continue;
    out.push({
      nom: r[0], equipe: r[1] || '—', matchsJoues: r[2] || 0, buts: r[3] || 0,
      tete: r[4] || 0, penalty: r[5] || 0, coupFranc: r[6] || 0, passes: r[7] || 0,
      jaunes: r[8] || 0, rouges: r[9] || 0, tempsJeu: r[10] || 0,
      convocations: r[11] || 0, titularisations: r[12] || 0,
      tauxConv: r[13], tauxTit: r[14], tempsMoyen: r[15] || 0,
    });
  }
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function resultat(m) {
  if (m.scoreNous == null || m.scoreAdv == null) return null;
  if (m.scoreNous > m.scoreAdv) return 'v';
  if (m.scoreNous < m.scoreAdv) return 'd';
  return 'n';
}
function resultatLabel(r) { return { v: 'Victoire', n: 'Nul', d: 'Défaite' }[r] || '—'; }

// ---------------------------------------------------------------
// Rendu général
// ---------------------------------------------------------------
function render() {
  document.getElementById('app').innerHTML =
    '<section id="view-equipe" class="view"></section>' +
    '<section id="view-joueurs" class="view"></section>';
  renderEquipe();
  renderJoueurs();
  showView(state.currentView);
}

function showView(name) {
  state.currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

// ---------------------------------------------------------------
// Vue Équipe
// ---------------------------------------------------------------
function filteredMatches() {
  return state.matches.filter(m => {
    if (state.filters.competition !== 'Toutes' && m.competition !== state.filters.competition) return false;
    if (state.filters.lieu !== 'Tous' && m.lieu !== state.filters.lieu) return false;
    return true;
  });
}

function renderEquipe() {
  const el = document.getElementById('view-equipe');
  const matches = state.matches;

  if (matches.length === 0) {
    el.innerHTML = '<div class="empty">Aucun match renseigné pour l\'instant.</div>';
    return;
  }

  const competitions = ['Toutes', ...new Set(matches.map(m => m.competition))];
  const lieux = ['Tous', ...new Set(matches.map(m => m.lieu))];

  el.innerHTML = `
    <div id="scoreboard"></div>
    <div class="filters">
      <label>Compétition
        <select id="f-competition">${competitions.map(c => `<option ${c===state.filters.competition?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
      </label>
      <label>Lieu
        <select id="f-lieu">${lieux.map(c => `<option ${c===state.filters.lieu?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
      </label>
    </div>
    <h2 class="section-title">Matchs</h2>
    <div class="table-wrap"><table id="match-table"></table></div>
    <h2 class="section-title">Buts marqués / encaissés par match</h2>
    <div class="chart-box"><canvas id="gap-chart"></canvas></div>
    <h2 class="section-title">Bilan par niveau d'adversaire</h2>
    <div id="niveau-grid" class="niveau-grid"></div>
  `;

  document.getElementById('f-competition').addEventListener('change', e => { state.filters.competition = e.target.value; renderEquipe(); });
  document.getElementById('f-lieu').addEventListener('change', e => { state.filters.lieu = e.target.value; renderEquipe(); });

  renderScoreboard(filteredMatches());
  renderMatchTable(filteredMatches());
  renderGapChart(filteredMatches());
  renderNiveauGrid(filteredMatches());
}

function renderScoreboard(matches) {
  let v=0,n=0,d=0,bp=0,bc=0;
  matches.forEach(m => {
    const r = resultat(m);
    if (r === 'v') v++; else if (r === 'n') n++; else if (r === 'd') d++;
    if (m.scoreNous != null) bp += m.scoreNous;
    if (m.scoreAdv != null) bc += m.scoreAdv;
  });
  document.getElementById('scoreboard').innerHTML = `
    <div class="scoreboard">
      <div class="record">
        <div class="v"><div class="big">${v}</div><small>Victoires</small></div>
        <div class="n"><div class="big">${n}</div><small>Nuls</small></div>
        <div class="d"><div class="big">${d}</div><small>Défaites</small></div>
      </div>
      <div class="goals">
        <div class="big"><span class="for">${bp}</span><span class="sep">–</span><span class="against">${bc}</span></div>
        <small>Buts pour — Buts contre</small>
      </div>
    </div>`;
}

function renderMatchTable(matches) {
  const table = document.getElementById('match-table');
  table.innerHTML = `
    <thead><tr>
      <th>Date</th><th>Adversaire</th><th>Compétition</th><th>Lieu</th>
      <th class="num">Score</th><th>Résultat</th><th class="num">Convoqués</th>
    </tr></thead>
    <tbody>
      ${matches.slice().reverse().map(m => {
        const r = resultat(m);
        const score = (m.scoreNous != null && m.scoreAdv != null) ? `${m.scoreNous} - ${m.scoreAdv}` : '—';
        return `<tr>
          <td>${fmtDate(m.date)}</td>
          <td>${escapeHtml(m.adversaire || '—')}</td>
          <td>${escapeHtml(m.competition)}</td>
          <td>${escapeHtml(m.lieu)}</td>
          <td class="num">${score}</td>
          <td>${r ? `<span class="badge ${r}">${resultatLabel(r)}</span>` : '—'}</td>
          <td class="num">${m.convoques != null ? m.convoques : '—'}${m.renforts ? ` <small>(${m.renforts} renf.)</small>` : ''}</td>
        </tr>`;
      }).join('')}
    </tbody>`;
}

function renderGapChart(matches) {
  const ctx = document.getElementById('gap-chart');
  const labels = matches.map(m => (m.adversaire || ('Match ' + m.numero)) + '\n' + fmtDate(m.date));
  const bp = matches.map(m => m.scoreNous);
  const bc = matches.map(m => m.scoreAdv);
  if (gapChart) gapChart.destroy();
  gapChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: matches.map(m => m.adversaire || ('Match ' + m.numero)),
      datasets: [
        { label: 'Buts pour', data: bp, backgroundColor: '#1E5631' },
        { label: 'Buts contre', data: bc, backgroundColor: '#A93F2B' },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' } } } },
      scales: {
        x: { ticks: { font: { family: 'Inter', size: 11 } } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { family: 'Inter' } } },
      },
    },
  });
}

function renderNiveauGrid(matches) {
  const groups = {};
  matches.forEach(m => {
    const k = m.niveau || 'Inconnu';
    if (!groups[k]) groups[k] = { total: 0, v: 0, n: 0, d: 0 };
    const g = groups[k];
    const r = resultat(m);
    if (r) {
      g.total++;
      if (r === 'v') g.v++; else if (r === 'n') g.n++; else g.d++;
    }
  });
  const order = ['Plus fort', 'Similaire', 'Plus faible', 'Inconnu'];
  const keys = Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  document.getElementById('niveau-grid').innerHTML = keys.map(k => {
    const g = groups[k];
    const pct = g.total ? Math.round((g.v / g.total) * 100) : 0;
    return `<div class="niveau-cell">
      <h3>${escapeHtml(k)}</h3>
      <div class="stat">${g.v}V ${g.n}N ${g.d}D <small>(${pct}% de victoires)</small></div>
    </div>`;
  }).join('') || '<div class="niveau-cell"><h3>—</h3><div class="stat">Pas de données</div></div>';
}

// ---------------------------------------------------------------
// Vue Joueurs
// ---------------------------------------------------------------
function filteredPlayers() {
  return state.players.filter(p => {
    if (state.playerFilters.scope === 'eq2' && p.matchsJoues === 0 && p.equipe !== 'Équipe 2') return false;
    if (state.playerFilters.scope === 'eq2only' && p.equipe !== 'Équipe 2') return false;
    if (state.playerFilters.search) {
      const s = state.playerFilters.search.toLowerCase();
      if (!p.nom.toLowerCase().includes(s)) return false;
    }
    return true;
  });
}

const SORTABLE_COLS = [
  { key: 'nom', label: 'Joueur' },
  { key: 'matchsJoues', label: 'MJ', num: true },
  { key: 'buts', label: 'Buts', num: true },
  { key: 'passes', label: 'Passes', num: true },
  { key: 'jaunes', label: 'CJ', num: true },
  { key: 'rouges', label: 'CR', num: true },
  { key: 'tempsJeu', label: 'Temps de jeu (min)', num: true },
  { key: 'tauxConv', label: '% convocation', num: true },
];

function renderJoueurs() {
  const el = document.getElementById('view-joueurs');
  if (state.players.length === 0) {
    el.innerHTML = '<div class="empty">Aucune donnée joueur pour l\'instant.</div>';
    return;
  }

  el.innerHTML = `
    <div class="filters">
      <div class="radio-group">
        <label><input type="radio" name="scope" value="eq2" ${state.playerFilters.scope==='eq2'?'checked':''}> Effectif Équipe 2 + renforts</label>
        <label><input type="radio" name="scope" value="eq2only" ${state.playerFilters.scope==='eq2only'?'checked':''}> Équipe 2 uniquement</label>
        <label><input type="radio" name="scope" value="all" ${state.playerFilters.scope==='all'?'checked':''}> Tous (Éq. 1 + Éq. 2)</label>
      </div>
      <label>Rechercher
        <input type="text" id="f-search" placeholder="Nom du joueur" value="${escapeHtml(state.playerFilters.search)}">
      </label>
    </div>
    <h2 class="section-title">Classement</h2>
    <div class="table-wrap"><table id="player-table"></table></div>
    <h2 class="section-title">Top buteurs</h2>
    <div class="chart-box"><canvas id="scorers-chart"></canvas></div>
    <h2 class="section-title">Fiche joueur</h2>
    <div class="player-picker">
      <select id="player-select"></select>
    </div>
    <div id="player-card"></div>
  `;

  document.querySelectorAll('input[name=scope]').forEach(r => {
    r.addEventListener('change', e => { state.playerFilters.scope = e.target.value; renderJoueurs(); });
  });
  document.getElementById('f-search').addEventListener('input', e => {
    state.playerFilters.search = e.target.value;
    renderPlayerTable();
  });

  renderPlayerTable();
  renderScorersChart();
  renderPlayerPicker();
}

function renderPlayerTable() {
  const players = filteredPlayers().slice();
  const { col, dir } = state.sort;
  players.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    else { va = va || 0; vb = vb || 0; }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  const table = document.getElementById('player-table');
  table.innerHTML = `
    <thead><tr>
      ${SORTABLE_COLS.map(c => `<th class="sortable ${c.num?'num':''} ${state.sort.col===c.key?'sort-active':''}" data-col="${c.key}">
        ${c.label}${state.sort.col===c.key ? (state.sort.dir==='asc'?' ▲':' ▼') : ''}
      </th>`).join('')}
    </tr></thead>
    <tbody>
      ${players.map(p => `<tr>
        <td>${escapeHtml(p.nom)} <small style="color:var(--ink-soft)">(${escapeHtml(p.equipe)})</small></td>
        <td class="num">${p.matchsJoues}</td>
        <td class="num">${p.buts}</td>
        <td class="num">${p.passes}</td>
        <td class="num">${p.jaunes}</td>
        <td class="num">${p.rouges}</td>
        <td class="num">${p.tempsJeu}</td>
        <td class="num">${p.tauxConv != null ? Math.round(p.tauxConv*100)+'%' : '—'}</td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">Aucun joueur ne correspond à ce filtre.</td></tr>'}
    </tbody>`;

  table.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort.col = col; state.sort.dir = 'desc'; }
      renderPlayerTable();
    });
  });
}

function renderScorersChart() {
  const top = state.players.filter(p => p.buts > 0).sort((a, b) => b.buts - a.buts).slice(0, 10);
  const ctx = document.getElementById('scorers-chart');
  if (topScorersChart) topScorersChart.destroy();
  if (top.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty">Aucun but inscrit pour l\'instant.</div>';
    return;
  }
  topScorersChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: top.map(p => p.nom),
      datasets: [{ label: 'Buts', data: top.map(p => p.buts), backgroundColor: '#1E5631' }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0, font: { family: 'Inter' } } },
        y: { ticks: { font: { family: 'Inter', size: 12 } } },
      },
    },
  });
}

function renderPlayerPicker() {
  const sel = document.getElementById('player-select');
  const players = state.players.filter(p => p.matchsJoues > 0).sort((a, b) => a.nom.localeCompare(b.nom));
  sel.innerHTML = players.map(p => `<option value="${escapeHtml(p.nom)}">${escapeHtml(p.nom)}</option>`).join('');
  if (players.length > 0) {
    state.selectedPlayer = state.selectedPlayer && players.some(p=>p.nom===state.selectedPlayer) ? state.selectedPlayer : players[0].nom;
    sel.value = state.selectedPlayer;
  }
  sel.addEventListener('change', e => { state.selectedPlayer = e.target.value; renderPlayerCard(); });
  renderPlayerCard();
}

function renderPlayerCard() {
  const box = document.getElementById('player-card');
  const p = state.players.find(pl => pl.nom === state.selectedPlayer);
  if (!p) { box.innerHTML = '<div class="empty">Aucun joueur sélectionné.</div>'; return; }
  box.innerHTML = `
    <div class="player-card">
      <h3>${escapeHtml(p.nom)}</h3>
      <div class="team-tag">${escapeHtml(p.equipe)}</div>
      <div class="player-stats">
        <div><div class="num">${p.matchsJoues}</div><small>Matchs joués</small></div>
        <div><div class="num">${p.buts}</div><small>Buts</small></div>
        <div><div class="num">${p.passes}</div><small>Passes déc.</small></div>
        <div><div class="num">${p.jaunes}</div><small>Cartons jaunes</small></div>
        <div><div class="num">${p.rouges}</div><small>Cartons rouges</small></div>
        <div><div class="num">${p.tempsJeu}</div><small>Minutes jouées</small></div>
        <div><div class="num">${p.tempsMoyen}</div><small>Min. / match</small></div>
        <div><div class="num">${p.tauxConv != null ? Math.round(p.tauxConv*100)+'%' : '—'}</div><small>Taux convocation</small></div>
        <div><div class="num">${p.tauxTit != null ? Math.round(p.tauxTit*100)+'%' : '—'}</div><small>Taux titularisation</small></div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
